<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="cha 茶, a forge CLI">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff6eb4"/>
      <stop offset="0.2" stop-color="#ff8fc3"/>
      <stop offset="0.35" stop-color="#f090f0"/>
      <stop offset="0.5" stop-color="#d67fe8"/>
      <stop offset="0.65" stop-color="#a8bcff"/>
      <stop offset="0.82" stop-color="#6ef3ff"/>
      <stop offset="1" stop-color="#6ef2b8"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="1" stop-color="#ff8fc3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="872" height="252" rx="36" fill="#1a1b26" stroke="url(#glow)" stroke-width="4"/>

  <!-- sparkles -->
  <g fill="#ffe14d">
    <path d="M90 52 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M800 60 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#6ef3ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></path>
    <path d="M760 200 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#ff6eb4"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M60 196 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#6ef2b8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></path>
    <path d="M470 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></path>
  </g>

  <!-- teacup -->
  <g transform="translate(130 70)">
    <g fill="none" stroke-linecap="round" stroke-width="6" filter="url(#soft)">
      <path d="M38 50 q-12 -16 0 -32 q12 -16 0 -32" stroke="#ff8fc3">
        <animateTransform attributeName="transform" type="translate" values="0 10;0 -6;0 10" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M66 50 q-12 -16 0 -32 q12 -16 0 -32" stroke="#a8bcff">
        <animateTransform attributeName="transform" type="translate" values="0 10;0 -6;0 10" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M94 50 q-12 -16 0 -32 q12 -16 0 -32" stroke="#6ef2b8">
        <animateTransform attributeName="transform" type="translate" values="0 10;0 -6;0 10" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M10 66 h112 v18 a56 56 0 0 1 -112 0z" fill="url(#cup)"/>
    <path d="M122 82 a20 20 0 1 1 0 34" fill="none" stroke="#ff8fc3" stroke-width="9"/>
    <ellipse cx="66" cy="66" rx="56" ry="9" fill="#6ef2b8"/>
    <ellipse cx="66" cy="150" rx="80" ry="8" fill="#ff6eb4" opacity="0.35"/>
    <!-- face -->
    <circle cx="46" cy="98" r="5" fill="#1a1b26"/>
    <circle cx="86" cy="98" r="5" fill="#1a1b26"/>
    <path d="M58 108 q8 8 16 0" fill="none" stroke="#1a1b26" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="36" cy="110" rx="8" ry="5" fill="#ff6eb4" opacity="0.7"/>
    <ellipse cx="96" cy="110" rx="8" ry="5" fill="#ff6eb4" opacity="0.7"/>
  </g>

  <text x="330" y="150" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Hiragino Maru Gothic ProN', 'Noto Sans CJK SC', system-ui, sans-serif" font-size="112" font-weight="800" fill="url(#glow)" filter="url(#soft)">cha 茶</text>
  <text x="334" y="198" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="21" fill="#c0caf5">gitea · forgejo · github, in one cute cup</text>
</svg>
