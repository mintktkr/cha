name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEND_VERSION: 2.0.39
      # sha256 of bend-2.0.39-linux-x64.tar.gz, from bend-lang.com/install.sh
      BEND_SHA256: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install bend
        run: |
          name=bend-$BEND_VERSION-linux-x64.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA256  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C "$HOME"
          echo "BEND=$HOME/bend/bin/bend" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.bend/lib
          key: bend-hub-${{ hashFiles('**/*.bend') }}
          restore-keys: bend-hub-
      - run: scripts/check.sh

  # the native lane has limits the JS lane doesn't (a def wider than 247 words fails
  # only here), so main gets a native build on every push, not just at release
  native:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEND_VERSION: 2.0.39
      BEND_SHA256: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install bend
        run: |
          name=bend-$BEND_VERSION-linux-x64.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA256  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C "$HOME"
      - uses: actions/cache@v4
        with:
          path: ~/.bend/lib
          key: bend-hub-${{ hashFiles('**/*.bend') }}
          restore-keys: bend-hub-
      - name: build
        run: |
          mkdir -p out
          $HOME/bend/bin/bend main.bend -o out/cha
      - name: smoke
        run: out/cha help > /dev/null
